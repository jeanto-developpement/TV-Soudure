<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production soudure – affichage TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E4EAF0; --panel:#FFFFFF; --panel2:#F3F6F9; --ink:#12202C; --muted:#586A7A; --line:#C6D1DB;
  --brand:#0B63C5; --brand-ink:#FFFFFF;
  --ok:#1E8A3C; --ok-ink:#FFFFFF; --wait:#F2A900; --wait-ink:#1B1400; --block:#C62828; --block-ink:#FFFFFF;
  --abs:#78858F; --abs-ink:#FFFFFF; --done:#0E7490; --done-ink:#FFFFFF; --warn-text:#9A5B00;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D151D; --panel:#162330; --panel2:#1C2C3B; --ink:#EAF0F5; --muted:#9DB0C0; --line:#2B3E50;
    --brand:#3D8EE8; --wait-ink:#1B1400; --warn-text:#F2B84B;
  }
}
:root[data-theme="dark"]{
  --bg:#0D151D; --panel:#162330; --panel2:#1C2C3B; --ink:#EAF0F5; --muted:#9DB0C0; --line:#2B3E50;
  --brand:#3D8EE8; --wait-ink:#1B1400; --warn-text:#F2B84B;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;font-size:min(0.8333vw,1.4815vh)}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;gap:.7rem;padding:.8rem 1rem .5rem}

/* ---------- barre du haut ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:1.4rem;
  background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:.55rem 1.1rem}
.logo{height:4.2rem;width:auto;display:block;background:#fff;border-radius:.3rem;padding:.2rem .5rem}
.title{font-family:var(--display);font-weight:700;font-size:2.35rem;line-height:1;letter-spacing:.01em}
.title small{display:block;font-family:var(--body);font-weight:500;font-size:1.05rem;color:var(--muted);margin-top:.3rem;letter-spacing:0}
.kpis{display:flex;gap:.6rem}
.kpi{display:flex;align-items:center;gap:.6rem;min-width:9.6rem;padding:.35rem .8rem;border-radius:.4rem;
  background:var(--panel2);border:1px solid var(--line)}
.kpi b{font-family:var(--display);font-weight:700;font-size:2.9rem;line-height:1;min-width:1.5ch;text-align:center}
.kpi span{font-size:1.05rem;line-height:1.15;font-weight:500}
.kpi.k-pres{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.k-ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.kpi.k-wait{background:var(--wait);border-color:var(--wait);color:var(--wait-ink)}
.kpi.k-block{background:var(--block);border-color:var(--block);color:var(--block-ink)}
.kpi.k-zero{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.kpi.k-flag{background:var(--panel2);border:2px dashed var(--wait);color:var(--ink)}
.clock{text-align:right;font-family:var(--display);font-weight:700}
.clock .t{font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-family:var(--body);font-weight:500;font-size:1.05rem;color:var(--muted);margin-top:.25rem}

/* ---------- colonnes par quart ---------- */
main{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;min-height:0}
.shift{display:grid;grid-template-rows:auto repeat(4,minmax(0,1fr));gap:.6rem;min-height:0}
.shift h2{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;display:flex;align-items:baseline;gap:.6rem}
.shift h2 span{font-family:var(--body);font-weight:500;font-size:1.05rem;color:var(--muted)}

/* ---------- carte employé ---------- */
.card{display:grid;grid-template-columns:.8rem 10.4rem minmax(0,1fr) 23.5rem;min-height:0;
  background:var(--panel);border:1px solid var(--line);border-radius:.5rem;overflow:hidden}
.strip{background:var(--abs)}
.card.s-ok .strip{background:var(--ok)} .card.s-wait .strip{background:var(--wait)}
.card.s-done .strip{background:var(--done)} .card.s-block .strip{background:var(--block)} .card.s-abs .strip{background:var(--abs)}
.who{padding:.7rem .8rem .6rem 1rem;display:flex;flex-direction:column;gap:.5rem;min-width:0;border-right:1px solid var(--line)}
.who .nm{font-family:var(--display);font-weight:700;font-size:2.15rem;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{align-self:flex-start;font-weight:600;font-size:1.05rem;line-height:1;padding:.4rem .65rem;border-radius:99rem;
  background:var(--abs);color:var(--abs-ink);white-space:nowrap}
.s-done .chip{background:var(--done);color:var(--done-ink)} .s-ok .chip{background:var(--ok);color:var(--ok-ink)} .s-wait .chip{background:var(--wait);color:var(--wait-ink)}
.s-block .chip{background:var(--block);color:var(--block-ink)}
.quote{margin-top:auto;font-size:1rem;line-height:1.25;color:var(--muted)}
.quote b{display:block;font-weight:600;color:var(--ink);font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.now{padding:.7rem 1rem .6rem;display:flex;flex-direction:column;justify-content:center;gap:.35rem;min-width:0}
.lbl{font-size:1rem;font-weight:600;color:var(--muted)}
.now .proj{font-family:var(--display);font-weight:700;font-size:2.7rem;line-height:1.02;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.now .fin{font-size:1.2rem;font-weight:600;color:var(--brand);line-height:1.25}
.now .op{font-size:1.3rem;font-weight:500;line-height:1.25}
.now .op em{font-style:normal;font-weight:600;color:var(--brand)}
.now .cage{font-size:1.15rem;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-abs .now .proj{color:var(--muted)}

.nxt{display:grid;grid-template-rows:1fr 1fr;border-left:1px solid var(--line);min-width:0}
.job{padding:.45rem .8rem;display:flex;flex-direction:column;justify-content:center;gap:.1rem;min-width:0}
.job + .job{border-top:1px solid var(--line)}
.job .p{font-weight:600;font-size:1.5rem;line-height:1.15;display:flex;gap:.45rem;align-items:center;min-width:0}
.job .p i{flex:none;width:.9rem;height:.9rem;border-radius:50%;background:var(--line)}
.job .p span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job.j-done .p i{background:var(--done)} .job.j-wait .p i{background:var(--wait)} .job.j-block .p i{background:var(--block)} .job.j-ok .p i{background:var(--ok)}
.job .o{font-size:1.1rem;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .n{font-size:1.1rem;font-weight:600;color:var(--warn-text);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job.empty .p{color:var(--muted);font-weight:500}
.job.flag{background:repeating-linear-gradient(135deg,transparent 0 .6rem,color-mix(in srgb,var(--wait) 16%,transparent) .6rem 1.2rem)}
.job.flag .p{color:var(--warn-text);font-weight:600}
.card.s-abs{opacity:.72}
.card.s-abs .nxt{visibility:hidden}

/* ---------- pied ---------- */
.foot{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);padding:0 .2rem}
.foot .stale{color:var(--block);font-weight:600}

/* ---------- petits écrans (téléphone) ---------- */
@media (max-width:900px){
  html{font-size:15px} body{height:auto;overflow:auto;display:block;padding:.6rem}
  body>*+*{margin-top:.7rem}
  .top{grid-template-columns:1fr;gap:.7rem} .kpis{flex-wrap:wrap} .clock{text-align:left}
  main{grid-template-columns:1fr} .shift{grid-template-rows:none}
  .card{grid-template-columns:.6rem 1fr;} .who,.now,.nxt{grid-column:2} .who{border-right:0}
  .strip{grid-row:1 / span 3} .nxt{border-left:0;border-top:1px solid var(--line)} .now .proj{font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============ RÉGLAGE : lien CSV publié de l’onglet « Dashboard Production v2 » ============
   Google Sheets > Fichier > Partager > Publier sur le Web > onglet « Dashboard Production v2 »
   > format « Valeurs séparées par des virgules (.csv) » > Publier > copier le lien ici.
   (Ou, sans modifier le fichier : ...html?sheet=IDENTIFIANT&gid=NUMERO — voir le mode d’emploi)                          */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcAFrAuydjB-CQgFlyCFcByrpw11MX-TRyy2jKx70ChpzXBLJYpDHSQ5TMw9obDxEzddYSj8wydBPx/pub?gid=976924303&single=true&output=csv";                              // (option Google Sheets, laisser vide avec Excel)
const XLSX_URL = "Soudure_Production.xlsx";       // fichier Excel déposé dans le même dépôt GitHub
const SHEET_NAME = "Dashboard Production v2";     // onglet à afficher
const REFRESH_SECONDS = 60;

/* Instantané de démonstration, utilisé tant que le lien CSV n’est pas configuré */

let lastOk = new Date("2026-11-23T18:41+00:00");

const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null&&text!=='')n.textContent=text;return n;};
const kind=s=>/absent/i.test(s)?'abs':/bloqu/i.test(s)?'block':/attente/i.test(s)?'wait':/marche/i.test(s)?'ok':/termin/i.test(s)?'done':'';
const opLine=j=>{
  const d=el('div','op'); const parts=[];
  if(j.op)parts.push(j.op);
  if(j.qty)parts.push('Qté : '+j.qty);
  d.append(parts.join(' · '));
  return d;
};

function nextJob(j,flagIfEmpty){
  const k=kind(j.status);
  const box=el('div','job'+(j.project?(k?' j-'+k:''):' empty')+((!j.project&&flagIfEmpty)?' flag':''));
  if(!j.project){
    box.append(el('div','p',flagIfEmpty?'Aucun job suivant':'—'));
    return box;
  }
  const p=el('div','p'); p.append(el('i'),el('span',null,j.project)); box.append(p);
  const o=[j.op,j.qty?'Qté : '+j.qty:''].filter(Boolean).join(' · ');
  if(o)box.append(el('div','o',o));
  if(j.note)box.append(el('div','n',j.note));
  else{const l=[j.date?'Début '+j.date:'',j.cage?'Cage '+j.cage:''].filter(Boolean).join(' · ');
    if(l)box.append(el('div','o',l));}
  return box;
}

function card(e){
  const k=kind(e.status), absent=k==='abs';
  const c=el('article','card s-'+(k||'ok'));
  c.append(el('div','strip'));
  const who=el('div','who'); who.append(el('div','nm',e.name),el('div','chip',e.status||'—'));
  if(e.quote.project||e.quote.drawing){
    const q=el('div','quote'); q.append(el('b',null,e.quote.project||''));
    q.append([e.quote.drawing?'Dessin '+e.quote.drawing:'',e.quote.note].filter(Boolean).join(' · '));
    who.append(q);
  }
  c.append(who);
  const now=el('div','now');
  if(absent){
    now.append(el('div','lbl','Absent'),el('div','proj','Hors quart'),el('div','op',e.cur.note||''));
  }else{
    now.append(el('div','lbl',k==='done'?'Terminé – prochain job à lancer':'En cours'));
    now.append(el('div','proj',e.cur.project||'Aucun job assigné'));
    const op=opLine(e.cur); if(op.textContent)now.append(op);
    if(e.cur.date)now.append(el('div','fin','Fin prévue '+e.cur.date));
    else if(e.cur.note)now.append(el('div','fin',e.cur.note));
    if(e.cur.cage)now.append(el('div','cage','Cage '+e.cur.cage));
  }
  c.append(now);
  const nx=el('div','nxt'); nx.append(nextJob(e.next[0],!absent),nextJob(e.next[1],false)); c.append(nx);
  return c;
}

function kpi(cls,n,label){const k=el('div','kpi '+cls);k.append(el('b',null,String(n)),el('span',null,label));return k;}

function render(){
  const pres=DATA.filter(e=>kind(e.status)!=='abs');
  const abs=DATA.length-pres.length;
  const run=DATA.filter(e=>kind(e.status)==='ok').length;
  const all=DATA.flatMap(e=>[e.cur,...e.next]);
  const wait=all.filter(j=>kind(j.status)==='wait').length;
  const blk=all.filter(j=>kind(j.status)==='block').length;
  const nonext=pres.filter(e=>!e.next[0].project).length;
  const K=document.getElementById('kpis'); K.replaceChildren(
    kpi('k-pres',pres.length+' / '+DATA.length,'Présents'),
    kpi(abs?'':'k-zero',abs,'Absents'),
    kpi(run?'k-ok':'k-zero',run,'Jobs en marche'),
    kpi(wait?'k-wait':'k-zero',wait,'Attente matériel'),
    kpi(blk?'k-block':'k-zero',blk,'Bloqués'),
    kpi(nonext?'k-flag':'k-zero',nonext,'Sans job suivant'));
  for(const s of ['jour','nuit']){
    const list=DATA.filter(e=>e.shift===s), box=document.getElementById(s);
    const h=el('h2',null,s==='jour'?'Quart de jour':'Quart de nuit');
    h.append(el('span',null,list.filter(e=>kind(e.status)!=='abs').length+' présent(s) sur '+list.length));
    box.replaceChildren(h,...list.map(card));
  }
}

/* ---------- lecture de la feuille Excel / Google Sheets ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const clean=s=>(s||'').replace(/\s+/g,' ').trim().replace(/'/g,'’');
const dropEmoji=s=>clean(s).replace(/^[^\p{L}\p{N}]+/u,'');
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function asDate(s){                       // retourne un libellé de date court, ou '' si ce n’est pas une date
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return (+m[3])+' '+MOIS[+m[2]-1];
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if(m) return (+m[1])+' '+MOIS[+m[2]-1];
  m=s.match(/^(\d{1,2})\s+(\p{L}+)\.?$/u);
  if(m){
    const k=m[2].toLowerCase().slice(0,3), i=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(k);
    const f=['jan','fév','mar','avr','mai','jui','jui','aoû','sep','oct','nov','déc'].indexOf(k);
    if(m[2].toLowerCase().startsWith('juin')||m[2].toLowerCase().startsWith('june')) return (+m[1])+' juin';
    if(m[2].toLowerCase().startsWith('juil')||m[2].toLowerCase().startsWith('july')) return (+m[1])+' juil.';
    const idx=i>=0?i:f;
    return idx>=0?(+m[1])+' '+MOIS[idx]:'';
  }
  return '';
}
function fromRows(R){
  const g=(r,c)=>clean((R[r-1]||[])[c]);          // r = numéro de ligne Excel, c = index de colonne (A=0)
  const out=[];
  for(let k=0;k<8;k++){
    const r=6+4*k, raw=g(r,0);
    if(!raw) continue;
    const sp=raw.indexOf(' ');
    const when=(c1,c2)=>{const v=g(r+3,c1)||g(r+3,c2);const d=asDate(v);return !v?{}:d?{date:d}:{note:v.replace(/^Note\s*:\s*/i,'')};};
    const job=(p,q,c1,c2,st)=>{
      const m=g(r+2,q).match(/\d+/);
      return Object.assign({project:g(r,p),cage:g(r+1,p),op:g(r+2,p),qty:m?+m[0]:null,status:dropEmoji(g(r,st))},when(c1,c2));
    };
    const cur=job(2,4,2,3,4), n1=job(6,8,6,7,8), n2=job(10,12,10,11,12);
    out.push({name:sp>0?raw.slice(sp+1).trim():raw, shift:raw.includes('🌙')?'nuit':'jour', status:cur.status,
      cur, next:[n1,n2],
      quote:{project:g(r,14),drawing:g(r+1,14).replace(/^Dessin\s*:\s*/i,''),note:[g(r+2,14),g(r+3,14)].filter(Boolean).join(' ')}});
  }
  return out;
}
async function getText(url){
  const r=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r;
}
async function readRows(){
  const q=new URLSearchParams(location.search);
  const csv=CSV_URL||q.get('csv')||(q.get('sheet')?'https://docs.google.com/spreadsheets/d/e/'+encodeURIComponent(q.get('sheet'))+'/pub?gid='+encodeURIComponent(q.get('gid')||'0')+'&single=true&output=csv':'');
  usingCsv=!!csv;
  if(csv) return parseCSV(await (await getText(csv)).text());
  const x=q.get('xlsx')||XLSX_URL;
  if(!x||typeof XLSX==='undefined') return null;
  const wb=XLSX.read(await (await getText(x)).arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[SHEET_NAME];
  if(!ws) throw new Error('onglet introuvable');
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',range:'A1:O40'});
}
async function load(){
  try{
    const rows=await readRows(); if(!rows) return;
    const d=fromRows(rows);
    if(!d.length) throw new Error('feuille vide');
    DATA=d; lastOk=new Date(); live=true; lastError=false; render();
  }catch(e){ lastError=true; lastErr=String((e&&e.message)||e); }
  tick();
}

function tick(){
  const now=new Date();
  document.getElementById('time').textContent=now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('date').textContent=now.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const hm=lastOk.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',hour12:false});
  const st=document.getElementById('stale');
  if(live){
    document.getElementById('stamp').textContent='Lu dans le Dashboard Production v2 à '+hm+' · actualisation automatique';
    const old=(now-lastOk)/6e4>10;
    st.textContent=(lastError||old)?'Connexion à la feuille perdue – dernières données de '+hm:''; st.className=st.textContent?'stale':'';
  }else{
    document.getElementById('stamp').textContent='Mode démonstration – fichier Excel introuvable (données du '+lastOk.toLocaleDateString('fr-CA',{day:'numeric',month:'long'})+')';
    st.textContent=(lastError&&usingCsv)?'Lecture de la feuille impossible ('+lastErr+') – vérifier le lien CSV et l’onglet publié':''; st.className=st.textContent?'stale':'';
  }
}
render(); tick(); load(); setInterval(tick,15000); setInterval(load,REFRESH_SECONDS*1000);
