<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production soudure – affichage TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#E4EAF0; --panel:#FFFFFF; --panel2:#F3F6F9; --ink:#12202C; --muted:#586A7A; --line:#C6D1DB;
  --brand:#0B63C5; --brand-ink:#FFFFFF;
  --ok:#1E8A3C; --ok-ink:#FFFFFF; --wait:#F2A900; --wait-ink:#1B1400; --block:#C62828; --block-ink:#FFFFFF;
  --grid:#26343F; --abs:#78858F; --abs-ink:#FFFFFF; --done:#5B6770; --done-ink:#FFFFFF; --warn-text:#9A5B00;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D151D; --panel:#162330; --panel2:#1C2C3B; --ink:#EAF0F5; --muted:#9DB0C0; --line:#2B3E50;
    --brand:#3D8EE8; --wait-ink:#1B1400; --warn-text:#F2B84B; --grid:#6C8091;
  }
}
:root[data-theme="dark"]{
  --bg:#0D151D; --panel:#162330; --panel2:#1C2C3B; --ink:#EAF0F5; --muted:#9DB0C0; --line:#2B3E50;
  --brand:#3D8EE8; --wait-ink:#1B1400; --warn-text:#F2B84B; --grid:#6C8091;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;font-size:min(0.8333vw,1.4815vh)}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;
  display:grid;grid-template-rows:auto 1fr auto;gap:.7rem;padding:.8rem 1rem .5rem}

/* ---------- barre du haut ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:1.4rem;
  background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:.55rem 1.1rem}
.logo{height:4.2rem;width:auto;display:block;background:#fff;border-radius:.3rem;padding:.2rem .5rem}
.title{font-family:var(--display);font-weight:700;font-size:2.35rem;line-height:1;letter-spacing:.01em}
.title small{display:block;font-family:var(--body);font-weight:500;font-size:1.05rem;color:var(--muted);margin-top:.3rem;letter-spacing:0}
.kpis{display:flex;gap:.6rem}
.kpi{display:flex;align-items:center;gap:.6rem;min-width:9.6rem;padding:.35rem .8rem;border-radius:.4rem;
  background:var(--panel2);border:1px solid var(--line)}
.kpi b{font-family:var(--display);font-weight:700;font-size:2.9rem;line-height:1;min-width:1.5ch;text-align:center}
.kpi span{font-size:1.05rem;line-height:1.15;font-weight:500}
.kpi.k-pres{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.k-ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.kpi.k-wait{background:var(--wait);border-color:var(--wait);color:var(--wait-ink)}
.kpi.k-block{background:var(--block);border-color:var(--block);color:var(--block-ink)}
.kpi.k-zero{background:var(--panel2);border-color:var(--line);color:var(--muted)}
.kpi.k-flag{background:var(--panel2);border:2px dashed var(--wait);color:var(--ink)}
.clock{text-align:right;font-family:var(--display);font-weight:700}
.clock .t{font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.clock .d{font-family:var(--body);font-weight:500;font-size:1.05rem;color:var(--muted);margin-top:.25rem}

/* ---------- tableau, comme le fichier Excel ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 14rem;gap:.9rem;min-height:0}
.tbl{display:grid;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr);min-height:0;border:2px solid var(--grid);border-radius:.35rem;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:9rem minmax(0,34fr) minmax(0,30fr) minmax(0,30fr);min-height:0;border-top:2px solid var(--grid)}
.row.head{border-top:0}
.hd{font-weight:700;font-size:1.25rem;padding:.5rem .8rem;color:#fff;display:flex;align-items:center;justify-content:center;gap:.5rem;letter-spacing:.01em}
.hd-emp{background:#1F3864}.hd-cur{background:#00703C}.hd-n1{background:#BF8F00}.hd-n2{background:#FFE699;color:#4D3B00}

.who{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;padding:.3rem .4rem;min-width:0;background:#FFF2CC;color:#1B2733}
.row.nuit .who{background:#DCDCF2}
.who .ic{font-size:1.7rem;line-height:1}
.who .nm{font-family:var(--display);font-weight:700;font-size:2.1rem;line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.blk{border-left:2px solid var(--grid);padding:.3rem .7rem .3rem .5rem;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;overflow:hidden}
.ln{display:grid;grid-template-columns:6.6rem minmax(0,1fr);column-gap:.6rem;align-items:center;min-height:0}
.k{text-align:right;font-size:.85rem;font-weight:600;color:var(--muted);white-space:nowrap}
.v{display:flex;align-items:center;gap:.5rem;min-width:0;font-size:1.08rem;line-height:1.25}
.v>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pn{font-size:1.35rem;font-weight:700;line-height:1.2}
.qty{margin-left:auto;font-weight:600;flex:none}
.v .st{margin-left:auto;flex:none}
.st{font-size:.95rem;font-weight:700;padding:.12rem .6rem;border-radius:99rem;white-space:nowrap;display:inline-flex;gap:.35rem;align-items:center;background:#fff;color:#333}
.st::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
.st-ok{background:#C6EFCE;color:#006100}.st-wait{background:#FFEB9C;color:#9C5700}
.st-block{background:#FFC7CE;color:#9C0006}.st-done{background:#D9D9D9;color:#404040}.st-abs{background:#fff;color:#A82424}
.late{background:#C00000;color:#fff;padding:.05rem .55rem;border-radius:.3rem;font-weight:700;overflow:visible!important}
.note{font-weight:600;color:var(--warn-text)}

/* couleur du projet, comme les règles de mise en forme du fichier Excel */
.tint{background:var(--pbg)}
.tint .pn{color:var(--pfg)}
.tint .k,.tint .v{color:color-mix(in srgb,var(--pfg) 72%,#000)}
.tint .pn{color:var(--pfg)}
.tint .note{color:color-mix(in srgb,var(--pfg) 72%,#000)}
.blk.flag{background:repeating-linear-gradient(135deg,transparent 0 .6rem,color-mix(in srgb,var(--wait) 16%,transparent) .6rem 1.2rem)}
.blk.flag .pn{color:var(--warn-text);font-size:1.2rem}

/* employé absent : toute la ligne en rouge, comme dans Excel */
.row.abs .who,.row.abs .blk{background:#E04B4B;color:#fff}
.row.abs .k,.row.abs .v,.row.abs .pn,.row.abs .note,.row.abs .who .nm{color:#fff}
.row.abs .st{background:#fff;color:#A82424}

/* ---------- panneau des quotes ---------- */
.side{display:flex;flex-direction:column;gap:.55rem;min-height:0}
.side h2{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1}
.side h2 span{display:block;font-family:var(--body);font-weight:500;font-size:1.05rem;color:var(--muted);margin-top:.25rem}
.qtile{flex:1 1 0;max-height:10rem;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.3rem;
  padding:.6rem .85rem;border:1px solid var(--line);border-radius:.5rem;background:var(--panel)}
.qtile.tint{background:var(--pbg)}
.qtile b{font-size:1.35rem;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.qtile span{font-size:1.05rem;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.qtile.tint b{color:var(--pfg)}
.qtile.tint span{color:color-mix(in srgb,var(--pfg) 70%,#000)}

/* ---------- pied ---------- */
.foot{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);padding:0 .2rem}
.foot .stale{color:var(--block);font-weight:600}

/* ---------- petits écrans (téléphone) ---------- */
@media (max-width:900px){
  html{font-size:15px} body{height:auto;overflow:auto;display:block;padding:.6rem}
  body>*+*{margin-top:.7rem}
  .top{grid-template-columns:1fr;gap:.7rem} .kpis{flex-wrap:wrap} .clock{text-align:left}
  main{grid-template-columns:1fr}
  .row{grid-template-columns:1fr} .row.head{display:none}
  .blk{border-left:0;border-top:1px solid var(--grid);gap:.2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============ RÉGLAGE : lien CSV publié de l’onglet « Dashboard Production v2 » ============
   Google Sheets > Fichier > Partager > Publier sur le Web > onglet « Dashboard Production v2 »
   > format « Valeurs séparées par des virgules (.csv) » > Publier > copier le lien ici.
   (Ou, sans modifier le fichier : ...html?sheet=IDENTIFIANT&gid=NUMERO — voir le mode d’emploi)                          */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcAFrAuydjB-CQgFlyCFcByrpw11MX-TRyy2jKx70ChpzXBLJYpDHSQ5TMw9obDxEzddYSj8wydBPx/pub?gid=976924303&single=true&output=csv";                              // (option Google Sheets, laisser vide avec Excel)
const XLSX_URL = "Soudure_Production.xlsx";       // fichier Excel déposé dans le même dépôt GitHub
const SHEET_NAME = "Dashboard Production v2";     // onglet à afficher
const REFRESH_SECONDS = 60;

/* Instantané de démonstration, utilisé tant que le lien CSV n’est pas configuré */

: "nuit", "status": "En marche", "cur": {"project": "Daikin 2 QTS", "cage": "176270-2-3", "op": "Soudage pipings", "qty": null, "status": "En marche", "date": "23 nov."}, "next": [{"project": "SVL Pecos", "cage": "176818-1 à 8 · Spool #2 p.13", "op": "Soudage pipings", "qty": 8, "status": "", "date": "23 nov."}, {"project": "SVL Pecos", "cage": "176819-1 à 8             SPOOL#2  p.13", "op": "Soudage pipings", "qty": 8, "status": "", "date": "24 nov."}], "quote": {"project": "HTS Flapping Airplaines", "drawing": "179124-1", "note": ""}}, {"name": "Fang", "shift": "nuit", "status": "En marche", "cur": {"project": "SVL Pecos", "cage": "176 820-1 à 8 · Spool #3 p.14", "op": "", "qty": 16, "status": "En marche", "date": "23 nov."}, "next": [{"project": "SVL Pecos", "cage": "176819-1 à 8      SPOOL#3  p.14", "op": "Soudage pipings", "qty": 8, "status": "", "date": "23 nov."}, {"project": "", "cage": "", "op": "", "qty": null, "status": ""}], "quote": {"project": "SVL CB Tundra", "drawing": "173266-1", "note": ""}}, {"name": "Jeremy", "shift": "nuit", "status": "En marche", "cur": {"project": "HTS Flapping Airplaines", "cage": "", "op": "Fabrication panneaux", "qty": 12, "status": "En marche"}, "next": [{"project": "HTS Flapping Airplaines", "cage": "", "op": "Fabrication supports", "qty": 24, "status": ""}, {"project": "HTS Flapping Airplaines", "cage": "", "op": "Fabrication Skid complet", "qty": 12, "status": ""}], "quote": {"project": "SVL Pecos", "drawing": "173758-1", "note": "Base #45 Next"}}, {"name": "Sam", "shift": "nuit", "status": "Absent", "cur": {"project": "", "cage": "", "op": "", "qty": null, "status": "Absent", "note": "Date de retour à déterminer"}, "next": [{"project": "", "cage": "", "op": "", "qty": null, "status": ""}, {"project": "", "cage": "", "op": "", "qty": null, "status": ""}], "quote": {"project": "", "drawing": "", "note": ""}}];
let lastOk = new Date("2026-11-23T18:41+00:00");
let live = false, lastError = false, lastErr = "", usingCsv = false;

const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null&&text!=='')n.textContent=text;return n;};
const PROJ=[['svl pecos','#FCE4EC','#D6007E'],['msk','#EADCF4','#7030A0'],['tundra','#D5F2F2','#008080'],
  ['edge','#DDF1FB','#0070C0'],['daikin 2','#FDE6D2','#C55A11'],['daikin #2','#FDE6D2','#C55A11'],['flapping','#E3F5C8','#3A7D00']];
function paint(node,name){
  if(!name) return;
  const n=name.toLowerCase(); let c=['','#E6D5C3','#5C3A1E'];
  for(const r of PROJ){ if(n.includes(r[0])){c=r;break;} }
  node.style.setProperty('--pbg',c[1]); node.style.setProperty('--pfg',c[2]); node.classList.add('tint');
}
const MOIS_C=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function isLate(label){
  const m=(label||'').match(/^(\d{1,2})\s+(.+)$/); if(!m) return false;
  const i=MOIS_C.indexOf(m[2]); if(i<0) return false;
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return new Date(now.getFullYear(),i,+m[1])<today;
}
const kind=s=>/absent/i.test(s)?'abs':/bloqu/i.test(s)?'block':/attente/i.test(s)?'wait':/marche/i.test(s)?'ok':/termin/i.test(s)?'done':'';
const SHORT={wait:'Attente'};
function line(label){
  const row=el('div','ln'), v=el('div','v');
  row.append(el('div','k',label),v); return {row,v};
}
function block(j,mode,opts){
  const next=mode==='next', b=el('div','blk');
  const k=kind(j.status);
  if(!opts.absent) paint(b,j.project);
  const empty=!j.project;
  const flag=empty&&next&&opts.flagEmpty;
  if(flag) b.classList.add('flag');
  // Projet + statut
  const l1=line('Projet :'); l1.v.append(el('span','pn',j.project||(flag?'Aucun job suivant':'')));
  if(j.status&&(mode==='cur'||j.project)){
    const label=(next&&SHORT[k])||j.status;
    l1.v.append(el('span','st st-'+(k||'ok'),label));
  }
  // Cage
  const l2=line('Cage :'); if(j.cage) l2.v.append(el('span',null,j.cage));
  // Opération + quantité
  const l3=line('Opération :'); if(j.op) l3.v.append(el('span',null,j.op));
  if(j.qty) l3.v.append(el('span','qty','Qté : '+j.qty));
  // Date / note
  const l4=line(next?'Début prévu :':'Fin prévue :');
  if(j.date){
    const late=!next&&isLate(j.date)&&k!=='done'&&!opts.absent;
    l4.v.append(el('span',late?'late':null,j.date+(late?' – en retard':'')));
  }
  if(j.note) l4.v.append(el('span','note',j.note));
  b.append(l1.row,l2.row,l3.row,l4.row);
  return b;
}
function rowEl(e){
  const k=kind(e.status), absent=k==='abs';
  const r=el('div','row '+e.shift+(absent?' abs':''));
  const who=el('div','who'); who.append(el('div','ic',e.shift==='nuit'?'🌙':'☀️'),el('div','nm',e.name));
  r.append(who);
  r.append(block(e.cur,'cur',{absent}));
  r.append(block(e.next[0],'next',{absent,flagEmpty:!absent}));
  r.append(block(e.next[1],'next',{absent}));
  return r;
}
function kpi(cls,n,label){const k=el('div','kpi '+cls);k.append(el('b',null,String(n)),el('span',null,label));return k;}

function render(){
  const pres=DATA.filter(e=>kind(e.status)!=='abs');
  const abs=DATA.length-pres.length;
  const run=DATA.filter(e=>kind(e.status)==='ok').length;
  const all=DATA.flatMap(e=>[e.cur,...e.next]);
  const wait=all.filter(j=>kind(j.status)==='wait').length;
  const blk=all.filter(j=>kind(j.status)==='block').length;
  const nonext=pres.filter(e=>!e.next[0].project).length;
  const K=document.getElementById('kpis'); K.replaceChildren(
    kpi('k-pres',pres.length+' / '+DATA.length,'Présents'),
    kpi(abs?'':'k-zero',abs,'Absents'),
    kpi(run?'k-ok':'k-zero',run,'Jobs en marche'),
    kpi(wait?'k-wait':'k-zero',wait,'Attente matériel'),
    kpi(blk?'k-block':'k-zero',blk,'Bloqués'),
    kpi(nonext?'k-flag':'k-zero',nonext,'Sans job suivant'));
  const head=el('div','row head');
  [['EMPLOYÉ','hd-emp',''],['JOB EN COURS','hd-cur','▶'],['JOB SUIVANTE #1','hd-n1','⏭'],['JOB SUIVANTE #2','hd-n2','⏭']]
    .forEach(([txt,cls,ic])=>head.append(el('div','hd '+cls,(ic?ic+'  ':'')+txt)));
  document.getElementById('tbl').replaceChildren(head,...DATA.map(rowEl));
  renderQuotes();
}

/* ---------- lecture de la feuille Excel / Google Sheets ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r') cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
const clean=s=>(s||'').replace(/\s+/g,' ').trim().replace(/'/g,'’');
const dropEmoji=s=>clean(s).replace(/^[^\p{L}\p{N}]+/u,'');
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function asDate(s){                       // retourne un libellé de date court, ou '' si ce n’est pas une date
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return (+m[3])+' '+MOIS[+m[2]-1];
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if(m) return (+m[1])+' '+MOIS[+m[2]-1];
  m=s.match(/^(\d{1,2})\s+(\p{L}+)\.?$/u);
  if(m){
    const k=m[2].toLowerCase().slice(0,3), i=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(k);
    const f=['jan','fév','mar','avr','mai','jui','jui','aoû','sep','oct','nov','déc'].indexOf(k);
    if(m[2].toLowerCase().startsWith('juin')||m[2].toLowerCase().startsWith('june')) return (+m[1])+' juin';
    if(m[2].toLowerCase().startsWith('juil')||m[2].toLowerCase().startsWith('july')) return (+m[1])+' juil.';
    const idx=i>=0?i:f;
    return idx>=0?(+m[1])+' '+MOIS[idx]:'';
  }
  return '';
}
function fromRows(R){
  const g=(r,c)=>clean((R[r-1]||[])[c]);          // r = numéro de ligne Excel, c = index de colonne (A=0)
  const out=[];
  for(let k=0;k<8;k++){
    const r=6+4*k, raw=g(r,0);
    if(!raw) continue;
    const sp=raw.indexOf(' ');
    const when=(c1,c2)=>{const v=g(r+3,c1)||g(r+3,c2);const d=asDate(v);return !v?{}:d?{date:d}:{note:v.replace(/^Note\s*:\s*/i,'')};};
    const job=(p,q,c1,c2,st)=>{
      const m=g(r+2,q).match(/\d+/);
      return Object.assign({project:g(r,p),cage:g(r+1,p),op:g(r+2,p),qty:m?+m[0]:null,status:dropEmoji(g(r,st))},when(c1,c2));
    };
    const cur=job(2,4,2,3,4), n1=job(6,8,6,7,8), n2=job(10,12,10,11,12);
    out.push({name:sp>0?raw.slice(sp+1).trim():raw, shift:raw.includes('🌙')?'nuit':'jour', status:cur.status,
      cur, next:[n1,n2],
      quote:{project:g(r,14),drawing:g(r+1,14).replace(/^Dessin\s*:\s*/i,''),note:[g(r+2,14),g(r+3,14)].filter(Boolean).join(' ')}});
  }
  return out;
}
async function getText(url){
  const r=await fetch(url+(url.includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error(r.status);
  return r;
}
async function readRows(){
  const q=new URLSearchParams(location.search);
  const csv=CSV_URL||q.get('csv')||(q.get('sheet')?'https://docs.google.com/spreadsheets/d/e/'+encodeURIComponent(q.get('sheet'))+'/pub?gid='+encodeURIComponent(q.get('gid')||'0')+'&single=true&output=csv':'');
  usingCsv=!!csv;
  if(csv) return parseCSV(await (await getText(csv)).text());
  const x=q.get('xlsx')||XLSX_URL;
  if(!x||typeof XLSX==='undefined') return null;
  const wb=XLSX.read(await (await getText(x)).arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[SHEET_NAME];
  if(!ws) throw new Error('onglet introuvable');
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',range:'A1:O40'});
}
async function load(){
  try{
    const rows=await readRows(); if(!rows) return;
    const d=fromRows(rows);
    if(!d.length) throw new Error('feuille vide');
    DATA=d; lastOk=new Date(); live=true; lastError=false; render(); fit();
  }catch(e){ lastError=true; lastErr=String((e&&e.message)||e); }
  tick();
}

function fit(){
  document.querySelectorAll('.pn').forEach(p=>{
    p.style.fontSize='';
    let s=parseFloat(getComputedStyle(p).fontSize); const min=s*0.55;
    while(p.scrollWidth>p.clientWidth+1&&s>min){s-=1;p.style.fontSize=s+'px';}
  });
}
function renderQuotes(){
  const seen=new Map();
  for(const e of DATA){
    const q=e.quote; if(!q.project&&!q.drawing) continue;
    const key=(q.project+'|'+q.drawing).toLowerCase();
    if(!seen.has(key)) seen.set(key,{project:q.project,drawing:q.drawing,notes:[]});
    if(q.note&&!seen.get(key).notes.includes(q.note)) seen.get(key).notes.push(q.note);
  }
  const side=document.getElementById('side');
  const h=el('h2',null,'Quotes de référence'); h.append(el('span',null,'Dessins à consulter'));
  const tiles=[...seen.values()].map(q=>{
    const d=el('div','qtile'); paint(d,q.project);
    d.append(el('b',null,q.project||'—'));
    if(q.drawing) d.append(el('span',null,'Dessin '+q.drawing));
    q.notes.forEach(n=>d.append(el('span',null,n)));
    return d;
  });
  side.replaceChildren(h,...tiles);
}
function tick(){
  const now=new Date();
  document.getElementById('time').textContent=now.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',hour12:false});
  document.getElementById('date').textContent=now.toLocaleDateString('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const hm=lastOk.toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit',hour12:false});
  const st=document.getElementById('stale');
  if(live){
    document.getElementById('stamp').textContent='Lu dans le Dashboard Production v2 à '+hm+' · actualisation automatique';
    const old=(now-lastOk)/6e4>10;
    st.textContent=(lastError||old)?'Connexion à la feuille perdue – dernières données de '+hm:''; st.className=st.textContent?'stale':'';
  }else{
    document.getElementById('stamp').textContent='Mode démonstration – fichier Excel introuvable (données du '+lastOk.toLocaleDateString('fr-CA',{day:'numeric',month:'long'})+')';
    st.textContent=(lastError&&usingCsv)?'Lecture de la feuille impossible ('+lastErr+') – vérifier le lien CSV et l’onglet publié':''; st.className=st.textContent?'stale':'';
  }
}
render(); fit(); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit); addEventListener('resize',fit); tick(); load(); setInterval(tick,15000); setInterval(load,REFRESH_SECONDS*1000);
</script>
